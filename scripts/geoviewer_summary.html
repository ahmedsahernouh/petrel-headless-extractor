<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldViewer · Project summary</title>
<style>
:root{--ink:#203246;--muted:#687988;--line:#dce2e8;--blue:#126a9c;--selected:#deedf9}*{box-sizing:border-box}body{margin:0;font:14px/1.45 'Segoe UI',Arial,sans-serif;color:var(--ink);background:#f0f3f6}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1289be;outline-offset:2px}.appbar{min-height:60px;background:#183248;color:white;display:flex;align-items:center;padding:10px 24px;gap:12px}.brand{font-size:17px;font-weight:650}.divider{height:21px;width:1px;background:#567082;margin:0 9px}.projectname{font-size:14px;color:#d8e6f1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.summarytag{margin-left:auto;border:1px solid #607887;border-radius:4px;font-size:12px;padding:3px 9px;white-space:nowrap;color:#e3edf4}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 92px);min-height:500px}.sidebar{background:#fafbfc;border-right:1px solid #cbd5de;overflow:auto}.pane-title{padding:13px 17px 9px;font-weight:650;border-bottom:1px solid var(--line);background:#e9eef3}.filter{margin:13px 13px 6px;width:calc(100% - 26px);padding:8px 10px;border:1px solid #becbd5;border-radius:4px;background:white}.tree-tools{display:flex;gap:12px;padding:0 15px 12px}.tree-tools button{border:0;background:transparent;color:#47708b;padding:0;font-size:12px}.tree{padding:4px 7px 18px}.tree-row{display:flex;align-items:center;min-height:31px;border-radius:3px;gap:2px}.tree-row.selected{background:var(--selected);box-shadow:inset 3px 0 var(--blue)}.tree-row:hover{background:#eaf0f5}.toggle{border:0;background:none;width:23px;height:28px;color:#536d7e;padding:0;flex-shrink:0}.node{display:flex;align-items:center;gap:7px;text-align:left;min-width:0;flex:1;padding:5px 7px 5px 0;border:0;background:none;color:var(--ink);font-size:13px}.node-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon{color:#a47c28;flex-shrink:0;width:17px;text-align:center}.count{color:#728391;font-size:11px;margin-left:auto;padding:0 8px}.content{padding:25px 30px 18px;overflow:auto;min-width:0}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:12px}.heading{display:flex;align-items:flex-start;gap:18px;justify-content:space-between}.heading h1{font-size:25px;line-height:1.25;letter-spacing:-.4px;margin:0 0 5px;font-weight:600}.subtitle{margin:0;color:var(--muted);font-size:13px}.status{font-size:11px;color:#355f77;background:#e5eff5;padding:4px 9px;border-radius:20px;white-space:nowrap;margin-top:4px}.stats{display:flex;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:6px;margin:20px 0}.stat{padding:12px 22px;min-width:145px;border-right:1px solid var(--line)}.stat b{font-size:20px;font-weight:600;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:6px;margin:18px 0;overflow:hidden}.panelhead{padding:11px 16px;border-bottom:1px solid #e5eaf0;font-weight:600;font-size:13px}.panelbody{padding:15px 17px}.note{color:var(--muted);font-size:13px}.downloads{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.download{display:inline-flex;align-items:center;padding:8px 13px;border-radius:4px;background:var(--blue);color:white;text-decoration:none;font-size:13px}.download.secondary{background:white;border:1px solid #bdcdd8;color:#245774}.data-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.data-card{background:white;border:1px solid var(--line);border-radius:5px;padding:13px 15px;text-align:left;color:var(--ink)}.data-card:hover{border-color:#5a98ba;background:#f5fafe}.data-card strong{font-size:14px;font-weight:600;display:block}.data-card small{color:var(--muted);display:block;margin-top:4px}.preview{max-height:360px;overflow:auto}.preview table{border-collapse:collapse;font-size:12px;width:100%}.preview th,.preview td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.footer{min-height:32px;display:flex;align-items:center;justify-content:space-between;padding:4px 16px;background:#e5ebf0;border-top:1px solid #cbd5de;font-size:11px;color:#5a6c7a}.footer a{color:#436d88;text-decoration:none}.empty{padding:15px;color:var(--muted);font-size:13px}@media(max-width:800px){.workspace{grid-template-columns:245px minmax(0,1fr)}.content{padding:20px 16px}.stat{padding:10px 14px;min-width:105px}.appbar{padding:8px 15px}}@media(max-width:560px){.workspace{display:block;height:auto}.sidebar{max-height:330px;border-bottom:1px solid var(--line)}.content{overflow:visible}.projectname{display:none}.footer{gap:8px;flex-wrap:wrap}}
.data-card{min-width:0;overflow-wrap:anywhere}.heading>div{min-width:0}.heading h1,.breadcrumb{overflow-wrap:anywhere}.header-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin:0 0 12px}.header-grid dt{font-size:12px;color:var(--muted)}.header-grid dd{margin:4px 0 0;font-size:17px;overflow-wrap:anywhere}.file-path{display:block;font-size:12px;margin:8px 0}.file-path input{display:block;width:100%;padding:8px;border:1px solid #bdcdd8;border-radius:3px;font-size:12px;margin-top:4px}.headers-shortcut{display:block;margin:4px 13px 10px;width:calc(100% - 26px);padding:9px;text-align:left;border:1px solid #bdcdd8;border-radius:4px;background:white;color:#126a9c}.headers-shortcut[hidden]{display:none}.well-link{border:0;background:none;color:#126a9c;text-decoration:underline;padding:0}</style></head><body>
<header class="appbar"><span class="brand">FieldViewer</span><span class="divider"></span><span class="projectname" id="project-name"></span><span class="summarytag">Project summary</span></header>
<div class="workspace"><aside class="sidebar" aria-label="Project data"><div class="pane-title">Input data</div><input class="filter" id="search" aria-label="Find a dataset" placeholder="Find a dataset…"><button id="headers" class="headers-shortcut" hidden>Well headers</button><div class="tree-tools"><button id="expand">Expand all</button><button id="collapse">Collapse all</button></div><nav id="tree" class="tree" aria-label="Dataset tree"></nav></aside><main class="content" id="content" aria-live="polite"></main></div>
<footer class="footer"><span id="footer-status"></span><a id="full-report" hidden>Detailed report ↗</a></footer>
<script>
const project=/*__DATA__*/;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root={id:'project',name:project.name,kind:'Project',status:project.status,children:project.categories.map(c=>({...c,kind:'Category',status:''}))};
const objects=new Map();function register(n,parent=null){objects.set(n.id,{...n,parent});(n.children||[]).forEach(c=>register(c,n.id))}register(root);
const headerWells=[...objects.values()].filter(n=>n.kind==='Wells'&&n.header).sort((a,b)=>a.name.localeCompare(b.name));if(headerWells.length){objects.set('well-headers',{id:'well-headers',name:'Well headers',kind:'Well headers',status:headerWells.length+' available',parent:'project',children:[]});$('headers').hidden=false;$('headers').textContent='Well headers ('+headerWells.length+')';$('headers').onclick=()=>choose('well-headers')}

let selected='project',open=new Set(['project',...project.categories.filter(c=>c.children.length<=10).map(c=>c.id)]);
function drawTree(){const query=$('search').value.trim().toLowerCase();function matches(n){return n.name.toLowerCase().includes(query)||(n.children||[]).some(matches)}function render(n,depth,ancestorMatch=false){const own=n.name.toLowerCase().includes(query),show=ancestorMatch||!query||matches(n);if(!show)return '';const children=n.children||[],expanded=open.has(n.id)||!!query;return '<div class="tree-row '+(selected===n.id?'selected':'')+'" style="padding-left:'+Math.min(depth,20)*16+'px">'+(children.length?'<button class="toggle" data-toggle="'+esc(n.id)+'" aria-label="'+(expanded?'Collapse ':'Expand ')+esc(n.name)+'" aria-expanded="'+expanded+'">'+(expanded?'▾':'▸')+'</button>':'<span class="toggle"></span>')+'<button class="node" data-node="'+esc(n.id)+'" '+(selected===n.id?'aria-current="true"':'')+'><span class="icon" aria-hidden="true">'+(children.length?'▤':'◆')+'</span><span class="node-name">'+esc(n.name)+'</span>'+(n.kind==='Category'?'<span class="count">'+children.length+'</span>':'')+'</button></div>'+(children.length&&expanded?children.map(c=>render(c,depth+1,ancestorMatch||own)).join(''):'')}const html=render(root,0);$('tree').innerHTML=html||'<div class="empty">No matching datasets</div>'}
function choose(id){selected=id;drawTree();drawContent();if(innerWidth<560)$('content').scrollIntoView({behavior:'smooth'})}
$('tree').addEventListener('click',e=>{const toggle=e.target.closest('[data-toggle]'),node=e.target.closest('[data-node]');if(toggle){const id=toggle.dataset.toggle;open.has(id)?open.delete(id):open.add(id);drawTree()}else if(node)choose(node.dataset.node)});
$('tree').addEventListener('keydown',e=>{const node=e.target.closest('[data-node]');if(!node)return;const n=objects.get(node.dataset.node);if(e.key==='ArrowRight'&&n.children?.length){open.add(n.id);drawTree();e.preventDefault()}if(e.key==='ArrowLeft'){open.delete(n.id);drawTree();e.preventDefault()}if(e.key==='Enter'||e.key===' '){choose(n.id);e.preventDefault()}});
$('search').addEventListener('input',drawTree);$('expand').onclick=()=>{objects.forEach(n=>{if(n.children?.length)open.add(n.id)});drawTree()};$('collapse').onclick=()=>{open=new Set(['project']);drawTree()};
function cards(items){return '<div class="data-list">'+items.map(n=>'<button class="data-card" data-go="'+esc(n.id)+'"><strong>'+esc(n.name)+'</strong><small>'+esc(n.kind||'Dataset')+(n.status?' · '+esc(n.status):'')+'</small></button>').join('')+'</div>'}
function plot(n){
 if(n.kind==='Polygons / Faults'){
  const g=n.polygon_preview;if(!g?.parts?.length)return '';
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const part of g.parts)for(const p of part.points){xmin=Math.min(xmin,p[0]);xmax=Math.max(xmax,p[0]);ymin=Math.min(ymin,p[1]);ymax=Math.max(ymax,p[1])}
  const scale=Math.min(620/(xmax-xmin||1),280/(ymax-ymin||1)),x=v=>360+(v-(xmin+xmax)/2)*scale,y=v=>180-(v-(ymin+ymax)/2)*scale;
  const paths=g.parts.map(part=>'<path d="'+part.points.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(2)+','+y(p[1]).toFixed(2)).join(' ')+(part.closed?' Z':'')+'" fill="none" stroke="#126a9c" stroke-width="1.5"/>').join('');
  return '<section class="panel polygon-image"><div class="panelhead">Complete linework preview</div><div class="panelbody"><svg viewBox="0 0 720 370" role="img" aria-label="Complete segmented XY linework for '+esc(n.name)+'" style="width:100%;max-height:370px">'+paths+'<text x="360" y="356" text-anchor="middle" fill="#687988">X → · +Y ↑</text></svg><p class="note">'+g.parts.length+' parts · '+g.vertices+' vertices · '+g.parts.filter(p=>p.closed).length+' closed parts</p><p class="note">'+esc(g.scope)+'</p></div></section>'
 }
 if(n.grid_preview){const g=n.grid_preview;return '<section class="panel grid-image"><div class="panelhead">Grid preview</div><div class="panelbody"><img src="'+esc(g.image)+'" alt="Sampled grid values for '+esc(n.name)+'" style="display:block;image-rendering:pixelated;max-width:100%;width:600px;max-height:360px;object-fit:contain;background:#f3f6f9"><p class="note">'+g.columns+' x '+g.rows+' sampled nodes | Values: '+esc(g.min)+' to '+esc(g.max)+'</p><p class="note">'+esc(g.scope)+'</p></div></section>'}

 const kind=n.kind,rows=n.preview||[];
 if(kind==='Surfaces / Grids'){
  const nodes=rows.filter(r=>r.x!==undefined&&r.y!==undefined&&r.raw_value!==undefined&&Number.isFinite(Number(r.x))&&Number.isFinite(Number(r.y))),xs=[...new Set(nodes.map(r=>Number(r.x)))].sort((a,b)=>a-b),ys=[...new Set(nodes.map(r=>Number(r.y)))].sort((a,b)=>b-a),valid=nodes.filter(r=>r._valid!==false&&Number.isFinite(Number(r.raw_value)));
  if(nodes.length&&xs.length<=32&&ys.length<=32&&xs.length*ys.length===nodes.length&&valid.length){
   const values=valid.map(r=>Number(r.raw_value)),lo=Math.min(...values),hi=Math.max(...values),cw=540/xs.length,ch=270/ys.length;
   let shapes='';for(const r of nodes){const okay=r._valid!==false&&Number.isFinite(Number(r.raw_value)),v=Number(r.raw_value),t=(v-lo)/(hi-lo||1),color=okay?'hsl('+(205-t*40)+' 48% '+(36+t*40)+'%)':'#e5e9ed',x=90+xs.indexOf(Number(r.x))*cw,y=35+ys.indexOf(Number(r.y))*ch;shapes+='<rect x="'+x+'" y="'+y+'" width="'+cw+'" height="'+ch+'" fill="'+color+'" stroke="white"/>';if(cw>45&&ch>24)shapes+='<text x="'+(x+cw/2)+'" y="'+(y+ch/2+4)+'" text-anchor="middle" style="fill:'+(okay&&t<.65?'white':'#203246')+'">'+(okay?esc(v):'null')+'</text>'}
   return '<section class="panel"><div class="panelhead">Grid preview</div><div class="panelbody"><svg viewBox="0 0 720 350" role="img" aria-label="Grid values for '+esc(n.name)+'" style="width:100%;max-height:370px">'+shapes+'<text x="360" y="335" text-anchor="middle" fill="#687988">'+xs.length+' × '+ys.length+' preview nodes · stored Z ('+esc(n.unit||'unit unresolved')+') · +Y ↑</text></svg></div></section>';
  }
 }
 let xkey,ykey;if(kind==='Well logs'){xkey=rows[0]?.raw_value!==undefined?'raw_value':'value';ykey=rows[0]?.md!==undefined?'md':'depth'}else if(kind==='Trajectories'){xkey='z';ykey='md'}else if(kind==='Surfaces / Grids'||kind==='Polygons / Faults'){xkey='x';ykey='y'}else return '';
 const points=rows.map(r=>{const a=Number(r[xkey]),b=Number(r[ykey]);return r._valid!==false&&r[xkey]!==undefined&&r[ykey]!==undefined&&Number.isFinite(a)&&Number.isFinite(b)?[a,b]:null}),good=points.filter(Boolean);if(good.length<2)return '';
 const xs=good.map(p=>p[0]),ys=good.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),depth=kind==='Well logs'||kind==='Trajectories',scale=Math.min(620/(xmax-xmin||1),280/(ymax-ymin||1)),spatial=!depth,x=v=>spatial?360+(v-(xmin+xmax)/2)*scale:50+(v-xmin)*620/(xmax-xmin||1),y=v=>depth?40+(v-ymin)*280/(ymax-ymin||1):180-(v-(ymin+ymax)/2)*scale;
 let started=false,path='';for(const p of points){if(!p){started=false;continue}path+=(started?'L':'M')+x(p[0]).toFixed(2)+','+y(p[1]).toFixed(2)+' ';started=true}
 return '<section class="panel"><div class="panelhead">Bounded data preview</div><div class="panelbody"><svg viewBox="0 0 720 370" role="img" aria-label="Preview of '+esc(n.name)+'" style="width:100%;max-height:370px"><rect x="50" y="40" width="620" height="280" fill="#f7fafc" stroke="#dfe7ed"/><path d="'+path+'" fill="none" stroke="#126a9c" stroke-width="2"/><text x="360" y="356" text-anchor="middle" fill="#687988">'+esc(xkey)+'</text><text x="17" y="180" transform="rotate(-90 17 180)" text-anchor="middle" fill="#687988">'+esc(ykey)+(depth?' (increases downward)':'')+'</text></svg></div></section>';
}
function preview(n){if(!n.preview?.length)return n.grid_preview||n.polygon_preview?plot(n):'';const keys=[...new Set(n.preview.flatMap(r=>Object.keys(r)))].filter(k=>k!=='_valid').slice(0,8);return plot(n)+'<details class="panel"><summary class="panelhead">Sample table · first '+n.preview.length+' rows at most</summary><div class="panelbody preview"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+n.preview.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>'}
function wellHeader(n){const h=n.header||{},cell=(label,value)=>'<div><dt>'+esc(label)+'</dt><dd>'+(value===null||value===undefined||value===''?'<span class="note">Not recovered</span>':esc(value))+'</dd></div>';let html='<section class="panel well-header"><div class="panelhead">Well header</div><div class="panelbody"><dl class="header-grid">'+cell('X',h.x)+cell('Y',h.y)+cell('KB elevation',h.kb)+cell('TD',h.td)+'</dl>';if(h.z!==null&&h.z!==undefined)html+='<p class="note">'+(String(h.z_status||'').includes('trajectory_start')?'Trajectory start Z':'Reported Z')+': '+esc(h.z)+' · This value is not a confirmed KB elevation.</p>';if(h.crs_status||h.horizontal_units_status||h.vertical_reference_status)html+='<details><summary class="note">Coordinate reference details</summary><p class="note">CRS: '+esc(h.crs_status||'Not recovered')+'<br>Coordinate units: '+esc(h.horizontal_units_status||'Not recovered')+'<br>Vertical reference: '+esc(h.vertical_reference_status||'Not recovered')+'</p></details>';if(h.download)html+='<div class="downloads"><a class="download secondary" href="'+esc(h.download)+'" download>Download all well headers (CSV)</a></div>';return html+'</div></section>'}
function localPath(href){try{const u=new URL(href,location.href);if(u.protocol==='file:'){let p=decodeURIComponent(u.pathname);return /^\/[A-Za-z]:/.test(p)?p.slice(1).replace(/\//g,String.fromCharCode(92)):p}return u.href}catch{return href}}
function datasetContent(n){let html='';if(n.notes?.length)html+='<section class="panel"><div class="panelhead">Dataset status</div><div class="panelbody note">'+n.notes.map(esc).join('<br>')+'</div></section>';if(n.files?.length){html+='<div class="downloads">'+n.files.map((f,i)=>'<a class="download '+(i?'secondary':'')+'" href="'+esc(f.href)+'" download>'+esc(f.label)+'</a>').join('')+'</div>';html+='<details class="panel file-locations"><summary class="panelhead">File locations (copy a path)</summary><div class="panelbody">'+n.files.map(f=>'<label class="file-path">'+esc(f.label.replace('Download ',' '))+'<input type="text" readonly aria-label="'+esc(f.label)+' file path" value="'+esc(localPath(f.href))+'" onclick="this.select()"></label>').join('')+'</div></details>'}else if(n.kind!=='Wells')html+='<p class="note">No accepted download is available for this dataset.</p>';return html+preview(n)}
function headerOverview(){const value=v=>v===null||v===undefined||v===''?'Not recovered':esc(v),files=[...new Set(headerWells.map(n=>n.header.download).filter(Boolean))];let html='<section class="panel"><div class="panelhead">Wellhead coordinates and header fields</div><div class="panelbody"><p class="note">Select a well name for its header, logs and trajectory. KB and TD are shown only when explicitly recovered.</p>'+files.map(h=>'<a class="download secondary" href="'+esc(h)+'" download>Download all well headers (CSV)</a>').join('')+'</div><div class="preview" style="max-height:600px"><table><thead><tr><th>Well</th><th>X</th><th>Y</th><th>KB elevation</th><th>TD</th></tr></thead><tbody>'+headerWells.map(n=>'<tr><td><button class="well-link" data-go="'+esc(n.id)+'">'+esc(n.name)+'</button></td><td>'+value(n.header.x)+'</td><td>'+value(n.header.y)+'</td><td>'+value(n.header.kb)+'</td><td>'+value(n.header.td)+'</td></tr>').join('')+'</tbody></table></div></section>';return html}
function hasPickFiles(n){return !!n.files?.length||(n.children||[]).some(hasPickFiles)}
function topsNotice(n){const relevant=n.kind==='Well tops'||n.kind==='Category'&&n.name==='Well tops';if(!relevant)return '';const native=project.well_top_status?.native_binding;if(native)return '<section class="panel tops-notice"><div class="panelhead">Recovered well tops</div><div class="panelbody note">'+native.rows+' schema-bound native picks across '+native.wells+' wells and '+native.formations+' formations. Exact native well and formation identities were bound through Model metadata. Independent export calibration is separate. Units and vertical datum are unresolved; native Z is not TVD.</div></section>';const recovered=project.well_top_status?.post_run_recovery;if(recovered)return '<section class="panel tops-notice"><div class="panelhead">Recovered well tops</div><div class="panelbody note">'+recovered.rows+' native picks across '+recovered.wells+' wells and '+recovered.formations+' formations. Well/formation/MD bindings were independently checked against the existing Petrel export. Native Z is not a resolved TVD datum.</div></section>';const info=project.well_top_status,unvalidated=info?.validated_rows===0;if(!unvalidated&&hasPickFiles(n)&&!n.tops_geometry_only)return '';return '<section class="panel tops-notice"><div class="panelhead">Well-top pick availability</div><div class="panelbody note">'+(info?.recovered_xyz_points?esc(info.recovered_xyz_points)+' XYZ points were recovered from Well Tops. Their well/formation labels, MD/TVD and reference metadata are not validated.':'Top names and relationships below are inventory metadata; MD/TVD picks are not recovered.')+' No validated well-top pick table is available in this run.'+(info?.validation?.reason==='no_validation_csv'?'<p>Validated native tops recovery was not attempted because no reference tops CSV was supplied.</p>':'')+'</div></section>'}

function topTable(n){const rows=n.top_picks||[];if(!rows.length)return '';const unit=(project.well_top_status?.post_run_recovery||project.well_top_status?.native_binding)?.units||{},num=v=>Number.isFinite(Number(v))?Number(v).toFixed(3):'Not recovered';return '<section class="panel well-top-table"><div class="panelhead">Well tops ('+rows.length+')</div><div class="panelbody note">Native MD and XYZ with exact well and formation links. Full numeric precision is retained in the CSV. Native Z is not relabelled as TVD.</div><div class="preview" style="max-height:500px"><table><thead><tr><th>Well</th><th>Formation</th><th>MD'+(unit.md?' ('+esc(unit.md)+')':' (unit unresolved)')+'</th><th>Native Z'+(unit.z?' ('+esc(unit.z)+')':' (unit unresolved)')+'</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.well_name)+'</td><td>'+esc(r.surface)+'</td><td>'+num(r.measured_depth)+'</td><td>'+num(r.z)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function drawContent(){const n=objects.get(selected);let crumbs=[],p=n;while(p){crumbs.unshift(p.name);p=objects.get(p.parent)}let html='<div class="breadcrumb">'+crumbs.map(esc).join(' / ')+'</div><div class="heading"><div><h1>'+esc(n.name)+'</h1><p class="subtitle">'+esc(n.kind||'Dataset')+(n.unit?' | Unit: '+esc(n.unit):'')+'</p></div>'+(n.status?'<span class="status">'+esc(n.status)+'</span>':'')+'</div>';
if(n.id==='project'){const counts=Object.entries(project.counts);html+='<div class="stats">'+counts.map(([k,v])=>'<div class="stat"><b>'+esc(v)+'</b><span>'+esc(k)+'</span></div>').join('')+'</div>';if(!counts.length)html+='<p class="note">No project datasets are available in the current catalogue.</p>';if(project.warnings.length)html+='<section class="panel"><div class="panelhead">Current limitations</div><div class="panelbody note">'+project.warnings.map(esc).join('<br>')+'</div></section>';html+=cards(n.children)}else if(n.kind==='Well headers'){html+=headerOverview()}else if(n.kind==='Category'){html+=topsNotice(n);if(n.name==='Well tops'&&(project.well_top_status?.post_run_recovery||project.well_top_status?.native_binding)){const picks=[...objects.values()].filter(o=>o.kind==='Well tops').flatMap(o=>o.top_picks||[]);if(picks.length)html+=topTable({top_picks:picks})}html+=n.children?.length?cards(n.children):'<p class="note">No datasets in this category.</p>'}else{if(n.kind==='Wells')html+=wellHeader(n);html+=topsNotice(n);html+=datasetContent(n);html+=topTable(n);if(n.children?.length)html+='<h2 style="font-size:15px;margin-top:22px">Related datasets</h2>'+cards(n.children)}$('content').innerHTML=html;$('content').querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{let p=objects.get(el.dataset.go);while(p){open.add(p.id);p=objects.get(p.parent)}choose(el.dataset.go)})}
$('project-name').textContent=project.name;$('footer-status').textContent='Summary status: '+project.status;if(project.detail){$('full-report').href=project.detail;$('full-report').hidden=false}drawTree();drawContent();
</script></body></html>
